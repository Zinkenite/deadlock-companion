[package]
name = "deadlock-companion"
version = "0.5.1"
description = "Local tactical companion for Deadlock"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deadchaps-reader-core = { path = "../vendor/deadchaps-reader/core", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Win32_System_WinRT"] }

